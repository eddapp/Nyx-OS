#!/usr/sbin/nft -f
# NyxOS baseline firewall — deny-all inbound by default.
# The control layer (nyx-route/nyx-health) rewrites the "nyx" table's rules
# at runtime to add VPN/Tor kill-switch policy; this file is the boot-time
# floor every session starts from.

flush ruleset

table inet nyx {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        icmp type echo-request limit rate 5/second accept
        icmpv6 type echo-request limit rate 5/second accept

        # DHCP client replies
        udp sport 67 udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
