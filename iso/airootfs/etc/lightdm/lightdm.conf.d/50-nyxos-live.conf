# NyxOS live medium: log the live user straight into the default Xfce
# session. lightdm-autologin's PAM stack requires membership of the
# `autologin` group (see /etc/group). The "NyxOS (Tiling)" session is still
# selectable from the greeter after logging out.
[Seat:*]
autologin-user=nyx
autologin-session=xfce
user-session=xfce
