#
# NyxOS installed-system pacman.conf (mirrors the profile's build-time one).
#
[options]
Architecture = auto
Color
ParallelDownloads = 5
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[blackarch]
SigLevel = Required DatabaseOptional
# Several mirrors, not the single upstream server: pacman tries each Server
# in order and moves to the next on any failure, and blackarch.org itself
# is slow enough that a multi-GB pacstrap through it alone aborts on
# "Operation too slow" / connection resets. List from
# https://blackarch.org/blackarch-mirrorlist (the same file the
# blackarch-mirrorlist package ships), nearest first for North America.
Server = https://ca.mirrors.cicku.me/blackarch/$repo/os/$arch
Server = https://mirror.cyberbits.eu/blackarch/$repo/os/$arch
Server = https://ftp.halifax.rwth-aachen.de/blackarch/$repo/os/$arch
Server = https://mirrors.dotsrc.org/blackarch/$repo/os/$arch
Server = https://de.mirrors.cicku.me/blackarch/$repo/os/$arch
Server = https://blackarch.org/blackarch/$repo/os/$arch

# NyxOS's own packages, shipped on this medium. Staged by iso/build.sh
# (stage_nyx_repo_in_airootfs) from the signed local repo the build produced;
# the signing key is trusted via the `nyxos` pacman keyring populated by
# pacman-init.service. Installed systems get the same block: archinstall
# copies the live pacman.conf into the target and nyx-install's post-install
# step copies /opt/nyxos/repo alongside it.
[nyxos]
SigLevel = Required TrustedOnly
Server = file:///opt/nyxos/repo
