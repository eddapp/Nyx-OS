# Hooks required to boot the live squashfs image (provided by mkinitcpio-archiso).
#
# `encrypt` (shipped by the `mkinitcpio` package itself, not a NyxOS-written
# hook) sits between `block` and `archiso`/`filesystems` so the "Encrypted
# Persistence" boot tier can unlock a LUKS-formatted persistence partition
# before archiso's own mount_handler tries to mount cow_device=. It is
# driven entirely by the standard `cryptdevice=<dev>:<name>[:options]`
# kernel command line parameter (see the nyxos-encrypted boot entry), which
# makes it prompt for a passphrase and create /dev/mapper/<name>.
#
# On every OTHER boot tier `cryptdevice=` is simply absent from the command
# line, and the hook is a verified no-op in that case: with no
# `cryptdevice=`, its cryptdev/cryptname fall back to `${root}`/"root",
# `${root}` is unset on archiso (archiso never sets root=), and
# resolve_device() on an empty string returns failure immediately (no
# device-glob pattern matches an empty string, so no polling/delay and no
# password prompt occurs) — confirmed by reading mkinitcpio's
# init_functions and the encrypt hook source directly.
#
# Requires the `cryptsetup` package to be present in the airootfs so
# mkinitcpio's `encrypt` install script can pull in /usr/bin/cryptsetup at
# initramfs build time (add it to packages.x86_64 / packages-server.x86_64).
HOOKS=(base udev modconf kms keyboard keymap consolefont block encrypt filesystems archiso archiso_loop_mnt)
