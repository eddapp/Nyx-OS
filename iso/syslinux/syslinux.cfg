UI vesamenu.c32
MENU TITLE NyxOS
TIMEOUT 150
DEFAULT nyxos

LABEL nyxos
  MENU LABEL NyxOS — Live (x86_64)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% lsm=landlock,lockdown,yama,integrity,apparmor,bpf quiet

LABEL nyxos-nomodeset
  MENU LABEL NyxOS — Live (x86_64, safe graphics)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% lsm=landlock,lockdown,yama,integrity,apparmor,bpf nomodeset quiet

# --- Boot tiers below (BIOS/legacy path) ---------------------------------
# Same kernel/initramfs as "nyxos" above; only the archiso/kernel command
# line differs per tier. See the sibling systemd-boot entries under
# iso/efiboot/loader/entries/ for the identical UEFI-path definitions and
# iso/airootfs/etc/mkinitcpio.conf.d/archiso.conf for the HOOKS change the
# Encrypted Persistence tier depends on.

LABEL nyxos-persistent
  MENU LABEL NyxOS — Persistent (x86_64)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% lsm=landlock,lockdown,yama,integrity,apparmor,bpf cow_label=NYXOS_PERSIST quiet

LABEL nyxos-encrypted
  MENU LABEL NyxOS — Encrypted Persistence (x86_64)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% lsm=landlock,lockdown,yama,integrity,apparmor,bpf cryptdevice=LABEL=NYXOS_PERSIST_ENC:nyxpersist cow_device=/dev/mapper/nyxpersist cow_persistent=P quiet

LABEL nyxos-forensics
  MENU LABEL NyxOS — Forensics: RAM-only (x86_64)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% lsm=landlock,lockdown,yama,integrity,apparmor,bpf copytoram=y nyx_forensics=1 quiet

# intel_iommu=on: the stock Arch `linux` kernel ships with
# CONFIG_INTEL_IOMMU_DEFAULT_ON unset, so Intel VT-d/DMAR needs this to
# actually turn on; it is a documented no-op on non-Intel hardware. AMD's
# IOMMU driver auto-enables from the ACPI IVRS table with no boot parameter
# needed, and "amd_iommu=on" is not a value the driver recognizes at all
# (verified against drivers/iommu/amd/init.c), so it is deliberately not
# passed. `iommu=pt` is deliberately NOT passed either: it would force
# passthrough (untranslated, 1:1) DMA as the default domain type, which is
# strictly *less* isolating against a malicious DMA-capable device than
# this kernel's own default (CONFIG_IOMMU_DEFAULT_DMA_LAZY=y, i.e.
# translated by default) -- adding it would weaken, not harden, DMA
# protection.
LABEL nyxos-hardened
  MENU LABEL NyxOS — Full Hardening: reduced compatibility (x86_64)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=confidentiality intel_iommu=on quiet
