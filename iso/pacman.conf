#
# NyxOS pacman.conf — used both to build the ISO (pacstrap source) and shipped
# as the live/installed system's /etc/pacman.conf.
#
[options]
Architecture = auto
Color
ParallelDownloads = 5
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# BlackArch tool repository, layered on top of vanilla Arch.
# Requires blackarch-keyring to be trusted on the build host before pacstrap
# runs — see build.sh, which imports and locally signs the BlackArch key.
[blackarch]
SigLevel = Required DatabaseOptional
Server = https://blackarch.org/blackarch/$repo/os/$arch
