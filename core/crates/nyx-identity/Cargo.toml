[package]
name = "nyx-identity"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
nix = { version = "0.31.3", features = ["user", "fs"] }
nyx-core = { version = "0.1.0", path = "../nyx-core" }
rand = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync"] }
tracing = "0.1.44"
