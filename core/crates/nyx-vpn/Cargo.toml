[package]
name = "nyx-vpn"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
nix = { version = "0.31.3", features = ["user", "fs"] }
nyx-core = { version = "0.1.0", path = "../nyx-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "process"] }
tracing = "0.1.44"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
