[workspace]
resolver = "2"
# iso/ holds build scratch space (iso/aur-work: AUR checkouts such as oniux,
# which is itself a cargo project). Without this, cargo walks up from those
# manifests, finds this workspace, and refuses to build them ("current
# package believes it's in a workspace when it's not").
exclude = ["iso"]
members = [
    "core/crates/nyx-core",
    "core/crates/nyx-health",
    "core/crates/nyx-vpn",
    "core/crates/nyx-identity",
    "core/crates/nyx-devices",
    "core/crates/nyx-telemetry",
    "core/crates/nyx-diagnostics",
    "core/crates/nyx-dns",
    "core/crates/nyx-integrity",
    "core/crates/nyx-wipe",
    "core/crates/nyx-isolation",
    "core/crates/nyx-workflow",
    "core/crates/nyx-hardening",
    "core/crates/nyx-watch",
    "core/crates/nyx-browsers",
    "dashboard",
]
