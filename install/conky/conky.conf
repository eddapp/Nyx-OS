-- NyxOS desktop overlay — Conky 1.24 config (current Lua-table config
-- format: `conky.config = {...}` / `conky.text = [[...]]`, in place since
-- Conky 1.10 and unchanged through 1.24, per Conky's own current
-- documentation/example configs).
--
-- Sits directly on the desktop background (own_window_type "desktop"),
-- click-through and undecorated, showing system stats plus real NyxOS
-- security/privacy state. Independently styled for NyxOS — not a copy of
-- any other product's colors, layout, or branding.
--
-- Deliberately never shows this machine's PUBLIC IP on any timer — see
-- the long comment in nyx-conky-status.sh, which this config calls for
-- the NyxOS-specific lines below. Do not add a public-IP widget here.

conky.config = {
    -- Behave as a passive desktop overlay, not an application window.
    own_window = true,
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class = 'conky-nyxos',
    own_window_argb_visual = true,
    own_window_argb_value = 190,
    own_window_transparent = false,

    -- Detach into its own background process; the autostart .desktop
    -- entry and the tiling session script both launch this once and move
    -- on rather than supervising it directly.
    background = true,
    double_buffer = true,
    -- $execi output here can run well past Conky's 256-byte default
    -- buffer; this avoids silently truncated NyxOS status lines.
    text_buffer_size = 2048,

    update_interval = 1,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,

    alignment = 'top_right',
    gap_x = 24,
    gap_y = 48,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    draw_shades = true,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,
    override_utf8_locale = true,

    default_color = 'C8CCD4',
    default_shade_color = '000000',
    own_window_colour = '0B0E14',
};

conky.text = [[
${color 8A7FFF}${font DejaVu Sans Mono:bold:size=12}NYXOS${font}${color}
${color 44485A}${hr 1}${color}
${color 8A7FFF}SYSTEM${color}
CPU        ${cpu}%  ${cpubar}
RAM        ${mem} / ${memmax}  (${memperc}%)
${membar}
Disk (/)   ${fs_used /} / ${fs_size /}  (${fs_used_perc /}%)
Uptime     ${uptime}

${color 8A7FFF}NETWORK${color}
${if_up eth0}Traffic    ${upspeed eth0} up / ${downspeed eth0} down (eth0)${endif}${if_up enp0s3}Traffic    ${upspeed enp0s3} up / ${downspeed enp0s3} down (enp0s3)${endif}${if_up eno1}Traffic    ${upspeed eno1} up / ${downspeed eno1} down (eno1)${endif}${if_up ens18}Traffic    ${upspeed ens18} up / ${downspeed ens18} down (ens18)${endif}${if_up ens33}Traffic    ${upspeed ens33} up / ${downspeed ens33} down (ens33)${endif}${if_up wlan0}Traffic    ${upspeed wlan0} up / ${downspeed wlan0} down (wlan0)${endif}${if_up wlp2s0}Traffic    ${upspeed wlp2s0} up / ${downspeed wlp2s0} down (wlp2s0)${endif}${if_up wlp3s0}Traffic    ${upspeed wlp3s0} up / ${downspeed wlp3s0} down (wlp3s0)${endif}

${color 8A7FFF}NYXOS SECURITY${color}
${execi 15 /usr/lib/nyx/conky/nyx-conky-status.sh}

${color 44485A}${time %a %d %b  %H:%M:%S}${color}
]];
