-- NyxOS desktop overlay — Conky 1.24 config (current Lua-table config
-- format: `conky.config = {...}` / `conky.text = [[...]]`, in place since
-- Conky 1.10 and unchanged through 1.24, per Conky's own current
-- documentation/example configs).
--
-- One tall column pinned to the right edge of the desktop (own_window_type
-- "desktop"), click-through and undecorated: clock, system graphs, live
-- network graphs, and real NyxOS security state. Everything animated here
-- is a stock Conky object (cpugraph, membar, downspeedgraph, ...); the
-- NyxOS-specific lines come from nyx-conky-status.sh via ${execpi}, whose
-- output is Conky markup and is display-tested in a QEMU boot of the ISO.
-- The status script strips "$", "{", "}" and "#" from every value it
-- interpolates so daemon-reported strings can never inject markup.
--
-- Deliberately never shows this machine's PUBLIC IP on any timer — see
-- the long comment in nyx-conky-status.sh. Do not add a public-IP widget.
--
-- Palette: NyxOS purple accent on near-black, silver text (matches
-- install/desktop-theme). Status colours: green = good, amber = attention,
-- red = leak/panic, grey = off/inactive.

conky.config = {
    own_window = true,
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class = 'conky-nyxos',
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_transparent = false,
    own_window_colour = '07060B',

    -- Detach into its own background process; the autostart .desktop
    -- entry and the tiling session script both launch this once and move
    -- on rather than supervising it directly.
    background = true,
    double_buffer = true,
    -- ${execpi} output here runs well past Conky's 256-byte default
    -- buffer; this avoids silently truncated NyxOS status lines.
    text_buffer_size = 4096,

    update_interval = 1,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    top_name_width = 14,

    alignment = 'top_right',
    gap_x = 28,
    gap_y = 44,
    minimum_width = 400,
    maximum_width = 400,
    border_inner_margin = 14,

    use_xft = true,
    font = 'JetBrains Mono:size=10',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    -- Graph borders on: Conky graphs fill from the right as samples arrive,
    -- so without a border a fresh graph is an invisible empty strip for the
    -- first few minutes. The border takes the current text colour, which
    -- is why every graph below is wrapped in ${color 3A3550}...${color}.
    draw_graph_borders = true,
    override_utf8_locale = true,

    default_color = 'C8CCD4',
    color1 = '9B7BFF',
    color2 = '6E7386',
    color3 = 'E6E8EF',
};

conky.text = [[
${alignc}${font JetBrains Mono:bold:size=36}${color3}${time %H:%M}${color}${font}
${alignc}${color2}${time %A, %d %B %Y}${color}
${alignc}${font JetBrains Mono:bold:size=11}${color1}NYXOS${color}${font}  ${color2}${nodename}  ·  ${kernel}${color}
${color1}${hr 1}${color}
${font JetBrains Mono:bold:size=10}${color1}SYSTEM${color}${font}${alignr}${color2}up ${uptime_short}${color}
${color2}CPU${color}${goto 70}${color3}${cpu cpu0}%${color}${goto 130}${color2}load${color} ${loadavg 1 5}
${color 3A3550}${cpugraph cpu0 30,372 5B21B6 C084FC -t}${color}
${color2}RAM${color}${goto 70}${color3}${mem}${color} / ${memmax}${alignr}${memperc}%
${color1}${membar 5,372}${color}
${color2}Disk /${color}${goto 70}${color3}${fs_used /}${color} / ${fs_size /}${alignr}${fs_used_perc /}%
${color1}${fs_bar 5,372 /}${color}
${color2}Procs${color}${goto 70}${color3}${processes}${color} (${running_processes} running)${alignr}${color2}top${color} ${top name 1}

${font JetBrains Mono:bold:size=10}${color1}NETWORK${color}${font}
${execpi 5 /usr/lib/nyx/conky/nyx-conky-status.sh network}

${font JetBrains Mono:bold:size=10}${color1}SECURITY${color}${font}
${execpi 5 /usr/lib/nyx/conky/nyx-conky-status.sh security}
]];
