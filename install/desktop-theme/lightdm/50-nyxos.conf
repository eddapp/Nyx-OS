# NyxOS LightDM GTK greeter look. A conf.d drop-in rather than
# /etc/lightdm/lightdm-gtk-greeter.conf, which the greeter package owns.
[greeter]
background=/usr/share/backgrounds/nyxos/nyxos-default.png
user-background=false
theme-name=Materia-dark
icon-theme-name=Papirus-Dark
font-name=Noto Sans 10
default-user-image=/usr/share/icons/hicolor/128x128/apps/nyxos-emblem.png
hide-user-image=false
clock-format=%H:%M
indicators=~host;~spacer;~clock;~spacer;~session;~power
panel-position=top
position=50%,center 50%,center
